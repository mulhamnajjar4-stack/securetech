<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيكيور تيك | SecureTech - للأنظمة الأمنية وكاميرات المراقبة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#0B132B', 900: '#0A1128', 950: '#050A18' },
                        brand: { blue: '#1C64F2', gold: '#F59E0B', goldHover: '#D97706' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        .hero-bg {
            background: linear-gradient(135deg, rgba(10, 17, 40, 0.95) 0%, rgba(11, 19, 43, 0.85) 100%), 
                        url('https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-navy-950 text-slate-100 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-navy-900/90 backdrop-blur-md border-b border-slate-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-blue to-brand-gold flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-shield-halved text-2xl text-white"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-black text-white block leading-none">سيكيور <span class="text-brand-gold">تيك</span></span>
                        <span class="text-xs text-slate-400 font-semibold tracking-wider">SECURE TECH</span>
                    </div>
                </div>

                <nav class="hidden md:flex items-center space-x-8 space-x-reverse font-medium text-sm">
                    <a href="#hero" class="hover:text-brand-gold transition-colors">الرئيسية</a>
                    <a href="#products" class="hover:text-brand-gold transition-colors">المنتجات والأسعار</a>
                    <a href="#calculator" class="hover:text-brand-gold transition-colors">حاسبة التكلفة</a>
                    <a href="#contact" class="hover:text-brand-gold transition-colors">تواصل معنا</a>
                </nav>

                <div class="flex items-center space-x-4 space-x-reverse">
                    <!-- Currency Switcher -->
                    <div class="flex items-center bg-navy-800 border border-slate-700 rounded-lg p-1 text-xs">
                        <button id="btn-usd" onclick="setCurrency('USD')" class="px-3 py-1.5 rounded-md font-bold transition-all bg-brand-gold text-navy-950">USD ($)</button>
                        <button id="btn-syp" onclick="setCurrency('SYP')" class="px-3 py-1.5 rounded-md font-bold transition-all text-slate-300 hover:text-white">ليرة سورية</button>
                    </div>

                    <!-- Cart Button -->
                    <button onclick="toggleCartModal()" class="relative bg-brand-blue/20 hover:bg-brand-blue/30 text-brand-blue border border-brand-blue/40 p-2.5 rounded-xl transition-all">
                        <i class="fa-solid fa-cart-shopping text-lg"></i>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-brand-gold text-navy-950 font-extrabold text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="hero" class="hero-bg py-20 flex-1 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full text-center md:text-right">
            <div class="grid md:grid-cols-2 gap-12 items-center">
                <div class="space-y-6">
                    <span class="inline-block bg-brand-gold/10 border border-brand-gold/30 px-4 py-1.5 rounded-full text-brand-gold text-sm font-semibold">
                        أنظمة مراقبة وأمان موثوقة 100%
                    </span>
                    <h1 class="text-4xl sm:text-5xl
